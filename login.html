<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>
    <div class="wrapper">
        <div class="main__wrapper">

            <header class="login__wrapper">
                <a href=""><svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-tie"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 22l4 -4l-2.5 -11l.993 -2.649a1 1 0 0 0 -.936 -1.351h-3.114a1 1 0 0 0 -.936 1.351l.993 2.649l-2.5 11l4 4" /><path d="M10.5 7h3l5 5.5" /></svg></a>
                <h1>Login</h1>
                <p>Ingresa a tu cuenta</p>
            </header>

            <form action="" class="login__form">
                <label for="email">Email:
                    <input type="email" id="email" placeholder="Ingresa tu email" required>
                </label>

                <label for="password">Password:
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </label>
                <div class="check__remed">
                    <label for="checkbox">

                        <input type="checkbox" id="checkbox">
                        Recordarme
                    </label>

                    <a href="">¿Olvidaste tu contraseña?</a>
                </div>

                <button class="btn btn--primary">Login</button>
            </form>
            <footer>
                <p>¿No tienes una cuenta? <a href="">Regístrate</a></p>
            </footer>
        </div>
    </div>
</body>
</html>
