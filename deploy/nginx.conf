resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_min_length 256;
gzip_vary on;

server {
    listen 80;
    server_name localhost;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cdnjs.cloudflare.com;" always;

    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sections/ {
        alias /usr/share/nginx/html/sections/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /src/ {
        alias /usr/share/nginx/html/src/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /img/ {
        alias /usr/share/nginx/html/public/img/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log combined buffer=32k;
    error_log /var/log/nginx/error.log warn;
}
